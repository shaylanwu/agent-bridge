name: release

# 语义发布（semantic-release）：版本号由**提交信息**决定，不由人决定。
#
#   feat: …            → minor
#   fix: …             → patch
#   feat!: … / BREAKING CHANGE: → major（协议破坏性变更，需人工审批后合入）
#   docs/chore/test/…  → 不发布（没有可发的内容时这个 workflow 什么都不做）
#
# 一次运行的完整动作：升 package.json 版本 → 写回 CHANGELOG.md → 打 v<version> tag
# → 建 GitHub Release → 发布 npm。站点（site.yml）随后重新构建，版本历史页读的就是同一个
# CHANGELOG.md —— 一处真源两处呈现，不存在"发布了但历史没更新"。
#
# ⛔ 不要再手工 `git tag vX.Y.Z`：tag 由这里生成，手工 tag 会和 semantic-release 抢版本号。
# ⛔ 触发分支只有 main —— develop 上随便提交都不会发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 发布不能并发：两个 job 同时算版本会打出两个 tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 打 tag、提交 CHANGELOG、建 GitHub Release
  issues: write
  pull-requests: write
  id-token: write # npm provenance

jobs:
  verify:
    name: verify (typecheck + test + boundaries)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 冒烟：CI 机器上多数 AI CLI 未安装，只验证命令能跑通、输出仍是合法 JSON
      - run: node dist/cli.js status --json
      # 发布前的边界校验（都是纯 node 脚本，跨平台）：协议唯一真源 / 文档与实现一致 / 契约与代码一致
      - run: npm run arch:check
      - run: npm run doc:check
      - run: npm run contracts:check

  release:
    name: semantic-release
    needs: verify
    # fork 里没有 NPM_TOKEN / GITHUB_TOKEN 的写权限，跑起来只会失败刷屏
    if: github.repository == 'shaylanwu/agent-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 必须全历史 + 全 tag：semantic-release 靠它找上一个版本、算这次该升哪一位
          fetch-depth: 0
          # 用 PAT 之外的方式提交回 CHANGELOG 时，push 由 @semantic-release/git 完成
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      # 先把 token 自身的问题暴露出来：semantic-release 失败时只会给一句 exit 1，
      # 分不清是"secret 没传到"、"token 无效"还是"token 没有发布权限"。
      # 只打印长度与它代表的 npm 账号名，不打印 token 本身。
      # ⛔ 不要用 `${{ toJSON(secrets) }}` 调试：把整个 secrets 上下文序列化会被 GitHub
      #    判为可疑操作，整个 workflow 直接停在 action_required（0 个 job 被执行）。
      - name: npm token 预检
        run: |
          TOKEN=""
          SOURCE=""
          for pair in "AGENT_BRIDGE_NPM_TOKEN:${C1}" "NPM_TOKEN:${C2}"; do
            name="${pair%%:*}"; val="${pair#*:}"
            if [ -n "$val" ] && [ -z "$TOKEN" ]; then TOKEN="$val"; SOURCE="$name"; fi
          done

          if [ -z "$TOKEN" ]; then
            echo "::error::npm token 为空 —— 两个候选名都没解析到值：AGENT_BRIDGE_NPM_TOKEN(len=${#C1}) / NPM_TOKEN(len=${#C2})。必须是仓库级 secret（Settings → Secrets and variables → Actions → Secrets），不是 environment secret"
            exit 1
          fi

          # 粘贴 token 时带上空格/换行是最常见的"token 明明对却 401"来源
          TOKEN=$(printf '%s' "$TOKEN" | tr -d '[:space:]')
          echo "token 来源：${SOURCE}，长度 ${#TOKEN}"
          export NODE_AUTH_TOKEN="$TOKEN"
          npm whoami || {
            echo "::error::token 被 npm 拒绝（whoami 失败）—— 多为已过期/被撤销/类型不对"
            exit 1
          }
          # 把身份与 2FA 模式写成 notice（能在 check-run annotation 里读到，便于定位
          # "token 有效但发不出去"这类权限问题：auth-and-writes 下的 classic token 必然 EOTP）
          WHO=$(npm whoami 2>/dev/null || echo '?')
          TFA=$(npm profile get 2>/dev/null | grep -i "two-factor" | head -1 | tr -s ' ' || true)
          echo "::notice::npm whoami=${WHO}${TFA:+；${TFA}}"
          # 传给下一步（GITHUB_ENV 的值会被日志掩码处理）
          echo "NPM_TOKEN=${TOKEN}" >> "$GITHUB_ENV"
        env:
          C1: ${{ secrets.AGENT_BRIDGE_NPM_TOKEN }}
          C2: ${{ secrets.NPM_TOKEN }}
      - name: semantic-release
        run: |
          set +e
          npx semantic-release > /tmp/semrel.log 2>&1
          status=$?
          set -e
          cat /tmp/semrel.log
          if [ "$status" -ne 0 ]; then
            # 把最相关的错误行提成 annotation：没有 PAT 也能从 check-run 里直接读出原因
            grep -iE "npm (error|ERR!)|EOTP|E401|E403|E404|ENEEDAUTH|denied|forbidden|not authorized|402 " /tmp/semrel.log \
              | head -6 | while IFS= read -r line; do echo "::error::${line}"; done
            echo "::error::semantic-release 退出码 ${status}（以上为最相关的错误行，完整日志见本步骤输出）"
            exit "$status"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 关掉 husky：这一步会由 @semantic-release/git 自动生成 `chore(release): x.y.z` 提交，
          # 没必要再过一遍 commit-msg 钩子（本地提交才需要拦）
          HUSKY: '0'
