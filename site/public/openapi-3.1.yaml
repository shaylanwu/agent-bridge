openapi: 3.1.0
info:
  title: agent-bridge platform HTTP contract
  version: '1.0.0'
  summary: 想驱动 agent-bridge 的平台必须实现的 HTTP 端点
  description: |
    这一份不是 agent-bridge 自己提供的接口，而是 **agent-bridge 作为客户端会去调用的接口**。
    任何第三方系统只要实现这四个端点，就能成为一台"编排平台"：用户在自己机器上执行
    `agent-bridge connect <你的地址>`，即可把本机 AI 编码 CLI 交给你调度。

    桥接方向请配合 `contracts/asyncapi-3.0.yaml`（WebSocket 通道）一起读：
    HTTP 只负责**绑定设备**，任务下发与事件回传全走那条出站 WebSocket。

    公开 JSON 错误响应应在顶层提供非空字符串 `code`；bridge 只读取这个机器可读字段，
    不会把响应正文写入日志。HTTP 状态码与 `code` 共同决定授权失败的处理方式。
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://platform.example.com
    description: 平台根地址（bridge 用 `connect` 的第一个参数）
security: []
tags:
  - name: binding
    description: 设备绑定（授权码 / 设备码）
paths:
  /bridge/authorize:
    get:
      tags: [binding]
      summary: 浏览器授权页（用户在此确认绑定）
      description: |
        bridge 拼出该 URL 后调用系统默认浏览器打开。页面需要复用用户已有的登录态，
        确认后把 `code` 302 回 `redirect_uri`。
      parameters:
        - name: client_id
          in: query
          required: true
          schema: { type: string, const: agent-bridge }
        - name: code_challenge
          in: query
          required: true
          description: base64url(sha256(verifier))，无填充
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{43}$' }
        - name: code_challenge_method
          in: query
          required: true
          schema: { type: string, const: S256 }
        - name: redirect_uri
          in: query
          required: true
          description: '回环地址，形如 http://127.0.0.1:<随机端口>/callback'
          schema: { type: string, format: uri }
        - name: state
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: 用户确认后重定向回 redirect_uri，带 code 与 state
          headers:
            Location:
              description: '{redirect_uri}?code=...&state=...'
              schema: { type: string, format: uri }
        '200':
          description: 直接渲染一个确认页面（由页面自行提交后重定向）
  /api/bridge/token:
    post:
      tags: [binding]
      summary: 用授权码换取 device_token（PKCE S256）
      description: |
        bridge 拿到 `code` 后调用。**必须校验 `codeVerifier` 满足 S256**：
        base64url(sha256(codeVerifier)) === 之前下发的 code_challenge。
        `deviceId` 是授权前已持久化的本地稳定身份；平台必须以它幂等重绑，不能另发新 ID。
        平台侧只保存 `device_token` 的 SHA-256，不明文存储。授权码交换后不自动重放。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, codeVerifier, redirectUri, clientId, deviceId, hostname, platform, cliVersion]
              properties:
                code: { type: string, minLength: 1 }
                codeVerifier: { type: string, minLength: 1 }
                redirectUri: { type: string, format: uri }
                clientId: { type: string, const: agent-bridge }
                deviceId: { $ref: '#/components/schemas/DeviceId' }
                hostname: { type: string, minLength: 1 }
                platform: { type: string, minLength: 1, examples: [win32, darwin, linux] }
                cliVersion: { type: string, minLength: 1 }
      responses:
        '200':
          description: 换取成功；`device_id` 必须等于请求中的 `deviceId`，否则 bridge 拒绝保存凭证或建立 WS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: code / verifier 校验失败；`invalid_device_id` 表示平台拒绝该 ID 格式，bridge 保留本地身份且不更换 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
              example: { code: invalid_device_id }
        '401':
          description: 授权或凭证失败；bridge 保留本地身份，不重放已交换的授权码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '403':
          description: 授权或凭证被拒绝；bridge 保留本地身份，不重放已交换的授权码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '409':
          description: '`device_bound_to_other_account`：设备属于其他账号；`device_identity_ambiguous`：平台历史身份重复。两者都需平台管理员处理；bridge 不换 ID，也不自动转移或合并'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
              examples:
                boundToOtherAccount:
                  value: { code: device_bound_to_other_account }
                ambiguousIdentity:
                  value: { code: device_identity_ambiguous }
        '404':
          description: 平台未实现该端点（bridge 会提示"平台配套接口未上线"）
  /api/bridge/device-code:
    post:
      tags: [binding]
      summary: 申请设备码（无浏览器 / SSH 场景）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [clientId]
              properties:
                clientId: { type: string, const: agent-bridge }
      responses:
        '200':
          description: 返回给用户的验证码与确认页
          content:
            application/json:
              schema:
                type: object
                required: [device_code, user_code, verification_uri]
                properties:
                  device_code: { type: string, description: bridge 轮询用的凭据 }
                  user_code: { type: string, description: 展示给用户的短码 }
                  verification_uri: { type: string, format: uri }
                  interval: { type: integer, default: 5, description: 轮询间隔（秒） }
                  expires_in: { type: integer, default: 600 }
        '404':
          description: 平台未实现该端点
  /api/bridge/device-token:
    post:
      tags: [binding]
      summary: 轮询设备码换取结果
      description: |
        每次轮询都携带同一个本地稳定 `deviceId` 与元信息。只有 `428 authorization_pending`
        表示可按服务端 `interval` 继续轮询；成功或终态错误后不自动重放该设备码。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code, clientId, deviceId, hostname, platform, cliVersion]
              properties:
                device_code: { type: string, minLength: 1 }
                clientId: { type: string, const: agent-bridge }
                deviceId: { $ref: '#/components/schemas/DeviceId' }
                hostname: { type: string, minLength: 1 }
                platform: { type: string, minLength: 1, examples: [win32, darwin, linux] }
                cliVersion: { type: string, minLength: 1 }
      responses:
        '200':
          description: 已确认；`device_id` 必须等于请求中的 `deviceId`，否则 bridge 拒绝保存凭证或建立 WS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: '`invalid_device_id` 表示平台拒绝该 ID 格式；bridge 保留本地身份，不更换 ID'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
              example: { code: invalid_device_id }
        '401':
          description: 授权或凭证失败；bridge 保留本地身份，不重放已终态交换的设备码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '403':
          description: 授权或凭证被拒绝；bridge 保留本地身份，不重放已终态交换的设备码
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
        '409':
          description: '`device_bound_to_other_account`：设备属于其他账号；`device_identity_ambiguous`：平台历史身份重复。两者都需平台管理员处理；bridge 不换 ID，也不自动转移或合并'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
              examples:
                boundToOtherAccount:
                  value: { code: device_bound_to_other_account }
                ambiguousIdentity:
                  value: { code: device_identity_ambiguous }
        '428':
          description: 顶层 `code` 为 `authorization_pending` 时，用户尚未确认；bridge 按服务端 interval 继续轮询且不生成新 ID
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicError' }
              example: { code: authorization_pending }
        '404':
          description: 平台未实现该端点
components:
  schemas:
    DeviceId:
      type: string
      minLength: 1
      pattern: '^bd_(?:[0-9a-f]{32}|[0-9a-f]{12})$'
      examples: [bd_001122334455]
      description: 本地持久化的稳定设备身份；新 ID 为 32 位小写 hex，迁移兼容 12 位小写 hex
    TokenResponse:
      type: object
      required: [device_token, device_id]
      properties:
        device_token:
          type: string
          minLength: 1
          description: 后续 WS 握手的 Bearer 凭据；bridge 只落 0600 文件
        device_id:
          allOf:
            - $ref: '#/components/schemas/DeviceId'
          description: 必须与本次请求的 `deviceId` 完全相等
        refresh_token:
          type: string
          minLength: 1
          description: 可选。当前 bridge 只保存、不使用；未实现自动续期
    PublicError:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          description: 公开机器可读错误码，位于 JSON 顶层；bridge 不记录响应正文
