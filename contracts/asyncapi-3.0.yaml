asyncapi: 3.0.0
info:
  title: agent-bridge WebSocket protocol
  version: '1.0.0'
  summary: 设备与编排平台之间的单条出站长连
  description: |
    **方向固定**：bridge 主动连出（`wss://<platform>/api/bridge/ws?deviceId=<id>`），
    平台**永不**向设备发起入站连接 —— 这是桥能穿 NAT、且不暴露任何入站端口的原因。

    握手：`Authorization: Bearer <device_token>`。
    心跳：bridge 每 15s 发一次 WS `ping`，另支持应用层 `ping` / `pong`。
    退避：断线后 1s→2s→…→30s 指数退避重连；`4401` / `4403` 表示凭据被吊销，**不再重连**。
    补发：断线期间的上行报文进有界缓冲（日志 256KB，控制类 200 条），重连后按序补发。

    版本规则：**新增可选字段 = 协议版本不变**（当前 PROTOCOL_VERSION = 2）；
    语义变更或新增必填字段 = 版本 +1。能力差异一律通过 `hello.capabilities` 协商，
    而不是猜 CLI 版本号。v2 要求 WS URL query 与 `hello.deviceId` 使用同一个合法、
    非空的本地稳定身份；不再允许空 ID 或仅凭 Bearer 反查设备身份。
  license:
    name: MIT
    identifier: MIT
servers:
  platform:
    host: platform.example.com:443
    protocol: wss
    pathname: /api/bridge/ws
    description: 由平台提供；bridge 侧只会用 wss（明文 ws 仅用于本地联调）
channels:
  upstream:
    title: bridge → platform
    description: 设备上报的握手信息、工具清单与任务事件
    messages:
      hello:
        name: hello
        title: 握手
        contentType: application/json
        payload:
          type: object
          required: [type, protocolVersion, deviceId, cliVersion, platform, hostname]
          properties:
            type: { type: string, const: hello }
            protocolVersion: { type: integer, const: 2 }
            deviceId:
              type: string
              minLength: 1
              pattern: '^bd_(?:[0-9a-f]{32}|[0-9a-f]{12})$'
              examples: [bd_001122334455]
              description: 本地持久化的稳定身份；必须与 WS URL 的 `deviceId` query 完全相等，不允许空 ID 或仅凭 Bearer 反查
            cliVersion: { type: string }
            platform: { type: string, examples: [win32, darwin, linux] }
            hostname: { type: string }
            capabilities:
              type: array
              description: |
                可选能力清单，平台据此降级。当前取值：diff / service-token / queue /
                scan-progress / cloud-events / capacity / task-step / task-message / task-snapshot / session-control / session-multi-turn / session-feed / task-interaction / elicitation-form / artifact-upload / artifact-download / interaction-url / permission-mode / artifact-inline / approval-ledger。
              items: { type: string }
            capacity:
              type: object
              description: 本次会话生效的调度额度（平台据此做有水位线的派发，而非靠 device_busy 试错）
              properties:
                maxTasks: { type: integer }
                maxQueued: { type: integer }
            execution:
              type: object
              description: |
                本次会话生效的执行侧策略。平台据此决定「能不能请求 full」与「要不要等交互」，
                不要按缺省值瞎猜：interactionEnabled=false 时不会出现任何 task_interaction_request。
              properties:
                permissionPolicy: { type: string, enum: [default, allow-full, full] }
                externalSandbox: { type: boolean }
                interactionEnabled: { type: boolean }
                interactionTimeoutMs: { type: integer }
                maxInteractionsPerTask: { type: integer }
                approvalLedgerEnabled:
                  type: boolean
                  description: |
                    持久授权账本是否开启（`approval-ledger` 能力的运行态开关）。开启时 interactive 的
                    persistent allow 会被记住；自动命中还必须 default 模式 + 请求真实提供该选项 + 指纹匹配。
      agent_list:
        name: agent_list
        title: 本机工具清单（首连终态）
        payload:
          type: object
          required: [type, agents, scannedAt]
          properties:
            type: { type: string, const: agent_list }
            agents: { type: array, items: { $ref: '#/components/schemas/AgentListItem' } }
            scannedAt: { type: string, format: date-time }
      scan_progress:
        name: scan_progress
        title: 扫描增量（流式）
        payload:
          type: object
          required: [type, items, scannedAt, done]
          properties:
            type: { type: string, const: scan_progress }
            requestId: { type: string }
            items: { type: array, items: { $ref: '#/components/schemas/AgentListItem' } }
            scannedAt: { type: string, format: date-time }
            done: { type: boolean }
      scan_result:
        name: scan_result
        title: 扫描终态（响应 scan 指令）
        payload:
          type: object
          required: [type, agents, scannedAt]
          properties:
            type: { type: string, const: scan_result }
            requestId: { type: string }
            agents: { type: array, items: { $ref: '#/components/schemas/AgentListItem' } }
            scannedAt: { type: string, format: date-time }
      task_log:
        name: task_log
        title: 任务输出分片
        description: |
          每片 ≤ 4096 字节（按 UTF-8 且不切断多字节字符）。
          bridge 侧会对正文做脱敏（家目录 → `~`，≥64 位长串折叠）。
        payload:
          type: object
          required: [type, taskId, stream, data, isAnsi]
          properties:
            type: { type: string, const: task_log }
            taskId: { type: string }
            stream: { type: string, enum: [stdout, stderr] }
            data: { type: string }
            isAnsi: { type: boolean, description: 当前恒为 true（ANSI 解析未实现） }
            turnId: { type: string }
            eventSeq: { type: integer, minimum: 1 }
      task_status:
        name: task_status
        title: 任务状态与终态产物
        description: |
          任务进入终态后，bridge **不会再发**该 task 的任何 `task_log`（终态幂等）。
          排队中的任务 status 仍为 `running`，额外给出 `phase: queued` 与 `queuePosition`
          （这是为了不让老平台收到未知状态值）。
        payload:
          type: object
          required: [type, taskId, status]
          properties:
            type: { type: string, const: task_status }
            taskId: { type: string }
            status: { type: string, enum: [running, success, failed, cancelled, timeout] }
            exitCode: { type: integer }
            error: { type: string, description: 人类可读文案，可直接展示 }
            errorCode:
              type: string
              description: 受控错误码，用于程序化分支（见 components/schemas/ErrorCode）
            phase: { type: string, enum: [queued, running, waiting_interaction, waiting_user] }
            queuePosition: { type: integer, minimum: 1 }
            turnId: { type: string }
            eventSeq: { type: integer, minimum: 1 }
            permissionMode:
              type: string
              enum: [default, full]
              description: |
                本次任务实际采用并用于构造命令的权限模式。只表示 bridge 的选择，
                **不是** CLI 实际权限的证明，也不是 OS 提权或环境沙箱。
            interactionId:
              type: string
              description: |
                phase=waiting_interaction 时正在等待的 requestId；回到 running 或进入终态时该字段消失
                （平台据「有无该字段」收起等待态，而不是靠超时猜）。
            stopReason:
              type: string
              enum: [end_turn, max_tokens, max_turn_requests, refusal, cancelled]
              description: ACP 回合结算原因；只有 end_turn 才可能 success，取消必须靠 cancelled。
            feedIncomplete:
              type: boolean
              description: canonical feed 未完整收尾；为 true 时平台必须展示「会话不完整」。
            diff:
              type: string
              description: unified diff，仅当 `run_task.captureDiff` 为 true 时出现
            changedFiles:
              type: array
              items: { type: string }
              description: 仓库相对路径，上限 500 条
            diffTruncated: { type: boolean }
            result:
              type: string
              description: 终态最终回答文本（步骤流工具从 result 事件提取；≤16KB）
            requestedBy:
              type: string
              description: 回显调用方身份，供平台落 requested_by 审计
      capacity_update:
        name: capacity_update
        title: 容量水位
        description: |
          每次调度状态变化（入队 / 启动 / 终态）后发送一次，反映平台与控制面
          两条通道的合计占用。平台据此知道「还能不能再派任务」，无需等 device_busy。
        payload:
          type: object
          required: [type, running, queued, maxTasks, maxQueued]
          properties:
            type: { type: string, const: capacity_update }
            running: { type: integer, description: 正在执行的任务数 }
            queued: { type: integer, description: 排队中的任务数 }
            maxTasks: { type: integer }
            maxQueued: { type: integer }
      task_step:
        name: task_step
        title: 任务步骤（动态步骤流）
        description: |
          AI CLI 的步骤由模型实时决定，没有预定义总步数；平台拿到的是「已发生的步骤序列 + 当前步骤」。
          仅 `agent_list` 中 `steps: true` 的工具会产生本消息。终态后该 task 的步骤一律丢弃（同 task_log）。
        payload:
          type: object
          required: [type, taskId, seq, action, state, at]
          properties:
            type: { type: string, const: task_step }
            taskId: { type: string }
            seq: { type: integer, minimum: 1, description: 从 1 单调递增 }
            action: { type: string, description: Bash / Edit / Read / command_execution / file_change… }
            label: { type: string, maxLength: 160, description: 目标摘要，与日志同口径脱敏 }
            state: { type: string, enum: [started, finished] }
            ok: { type: boolean, description: 仅 state=finished 时给出 }
            ref: { type: string, description: 源事件关联 id（started/finished 配对） }
            at: { type: string, format: date-time }
            turnId: { type: string }
            eventSeq: { type: integer, minimum: 1 }
      task_message:
        name: task_message
        title: canonical 会话消息
        description: delta 是流式增量，complete 是最终完整文本；messageId 供平台幂等去重。
        payload:
          type: object
          required: [type, taskId, messageId, role, state, text, at]
          properties:
            type: { type: string, const: task_message }
            taskId: { type: string }
            messageId: { type: string }
            role: { type: string, enum: [user, agent, system] }
            state: { type: string, enum: [delta, complete] }
            text: { type: string }
            turnId: { type: string }
            eventSeq: { type: integer, minimum: 1 }
            at: { type: string, format: date-time }
      task_snapshot:
        name: task_snapshot
        title: 任务历史快照
        description: 响应 get_task；终态后仍可补取，events 按 eventSeq 升序。
        payload:
          type: object
          required: [type, taskId, found]
          properties:
            type: { type: string, const: task_snapshot }
            taskId: { type: string }
            requestId: { type: string }
            found: { type: boolean }
            session: { type: object, additionalProperties: true }
            turns:
              type: array
              items: { type: object, additionalProperties: true }
            events:
              type: array
              items:
                type: object
                required: [eventSeq, type, payload, createdAt]
                properties:
                  eventSeq: { type: integer, minimum: 1 }
                  type: { type: string }
                  payload: { type: object, additionalProperties: true }
                  createdAt: { type: string, format: date-time }
            oldestEventSeq: { type: integer }
            latestEventSeq: { type: integer }
            hasMoreBefore:
              type: boolean
              description: 窗口起点之前还有内容（尾部窗口在长会话上为 true，回翻控制器据此继续往前取）。
            prunedThrough:
              type: integer
              minimum: 0
              description: 历史裁剪水位；未裁剪的会话不带此字段。请求游标小于它时 errorCode=session_history_pruned。
            partialMessages:
              type: array
              description: >-
                本回合已吐出但还没定稿的助手文本（只在内存里、不落库）；中途重连时用来避免空白。
                终态之后为空数组或缺失 —— 那时该读 events 里的 complete。没有流式文本通道的适配器
                （headless）此处为空，属如实缺省。
              items:
                type: object
                required: [messageId, role, text, updatedAt]
                properties:
                  messageId:
                    type: string
                    description: >-
                      形如 pm_<taskId>。刻意区别于落库消息的 msg_* 幂等键：半截文本会被 complete 顶替，
                      不要拿它做去重或与 MsgId 对等。
                  role: { type: string, enum: [user, agent, system] }
                  text: { type: string }
                  updatedAt: { type: string, format: date-time }
                  truncated:
                    type: boolean
                    description: 已达上限（32 KiB），后续增量不再累积。
            eventWindow:
              type: object
              description: 事件窗口完整性；gaps 为空数组表示序号连续。
              properties:
                oldestEventSeq: { type: integer }
                latestEventSeq: { type: integer }
                gaps:
                  type: array
                  items:
                    type: object
                    required: [from, to]
                    properties:
                      from: { type: integer }
                      to: { type: integer }
            errorCode: { type: string }
      artifact_content:
        name: artifact_content
        title: 附件内联内容
        description: >-
          响应 get_artifact。超过内联上限（1 MB）只回元数据并置 contentUnavailableReason=too_large，
          平台应改走 artifact_download 分块通道。终态后仍可取，且不会重读工作区。
        payload:
          type: object
          required: [type, taskId, artifactId, found]
          properties:
            type: { type: string, const: artifact_content }
            taskId: { type: string }
            artifactId: { type: string }
            requestId: { type: string }
            found: { type: boolean }
            name: { type: string }
            mimeType: { type: string }
            size: { type: integer }
            sha256: { type: string }
            kind: { type: string }
            data: { type: string, description: base64 内容；仅可内联时出现 }
            contentUnavailableReason: { type: string, enum: [too_large, not_readable] }
            errorCode: { type: string }
      task_artifact:
        name: task_artifact
        title: 入站附件已提交
        payload:
          type: object
          required: [type, taskId, artifactId, name, mimeType, size, sha256, kind]
          properties:
            type: { type: string, const: task_artifact }
            taskId: { type: string }
            artifactId: { type: string }
            name: { type: string }
            mimeType: { type: string }
            size: { type: integer, minimum: 0 }
            sha256: { type: string }
            kind: { type: string }
            eventSeq: { type: integer, minimum: 1 }
      artifact_upload_ready:
        name: artifact_upload_ready
        title: 上传就绪
        payload:
          type: object
          required: [type, transferId, artifactId, nextOffset, chunkSize]
          properties:
            type: { type: string, const: artifact_upload_ready }
            transferId: { type: string }
            artifactId: { type: string }
            nextOffset: { type: integer, minimum: 0 }
            chunkSize: { type: integer, minimum: 1 }
      artifact_upload_chunk_ack:
        name: artifact_upload_chunk_ack
        title: 上传 chunk 确认
        payload:
          type: object
          required: [type, transferId, nextOffset]
          properties:
            type: { type: string, const: artifact_upload_chunk_ack }
            transferId: { type: string }
            nextOffset: { type: integer, minimum: 0 }
      artifact_download_ready:
        name: artifact_download_ready
        title: 下载就绪
        payload:
          type: object
          required: [type, transferId, artifactId, size, sha256, chunkSize]
          properties:
            type: { type: string, const: artifact_download_ready }
            transferId: { type: string }
            artifactId: { type: string }
            size: { type: integer, minimum: 0 }
            sha256: { type: string }
            chunkSize: { type: integer, minimum: 1 }
      artifact_download_chunk:
        name: artifact_download_chunk
        title: 下载附件 chunk
        payload:
          type: object
          required: [type, transferId, offset, data, chunkSha256]
          properties:
            type: { type: string, const: artifact_download_chunk }
            transferId: { type: string }
            offset: { type: integer, minimum: 0 }
            data: { type: string, description: base64 }
            chunkSha256: { type: string }
      artifact_download_result:
        name: artifact_download_result
        title: 下载结果
        payload:
          type: object
          required: [type, transferId, status]
          properties:
            type: { type: string, const: artifact_download_result }
            transferId: { type: string }
            status: { type: string, enum: [completed, failed] }
            errorCode: { type: string }
      artifact_upload_result:
        name: artifact_upload_result
        title: 上传结果
        payload:
          type: object
          required: [type, transferId, status]
          properties:
            type: { type: string, const: artifact_upload_result }
            transferId: { type: string }
            status: { type: string, enum: [committed, failed] }
            artifactId: { type: string }
            sha256: { type: string }
            eventSeq: { type: integer, minimum: 1 }
            errorCode: { type: string }
      task_interaction_request:
        name: task_interaction_request
        title: 交互请求
        description: 权限 / Form / URL 请求；平台必须按 kind 选择对应 UI。
        payload:
          type: object
          required: [type, taskId, requestId, kind, payload]
          properties:
            type: { type: string, const: task_interaction_request }
            taskId: { type: string }
            requestId: { type: string }
            turnId: { type: string }
            kind: { type: string, enum: [permission, form, auth-url] }
            payload: { type: object, additionalProperties: true }
            expiresAt: { type: string, format: date-time }
            eventSeq: { type: integer, minimum: 1 }
      interaction_url:
        name: interaction_url
        title: 交互短期 URL
        description: URL 仅存 bridge 进程内，带 TTL；不写入 SQLite 或日志。过期回 interaction_url_expired，从未注册/已撤销回 interaction_url_not_found。
        payload:
          type: object
          required: [type, taskId, requestId, ok]
          properties:
            type: { type: string, const: interaction_url }
            taskId: { type: string }
            requestId: { type: string }
            ok: { type: boolean }
            url: { type: string }
            expiresAt: { type: string, format: date-time }
            errorCode: { type: string }
      task_interaction_result:
        name: task_interaction_result
        title: 交互结果
        description: 终态后仍可按 requestId + resultSeq 重放。
        payload:
          type: object
          required: [type, taskId, requestId, state]
          properties:
            type: { type: string, const: task_interaction_result }
            taskId: { type: string }
            requestId: { type: string }
            state: { type: string, enum: [accepted, declined, cancelled, expired, failed] }
            responseId: { type: string }
            resultSeq: { type: integer, minimum: 1 }
            resultPayload: { type: object, additionalProperties: true }
            errorCode: { type: string }
            eventSeq: { type: integer, minimum: 1 }
      message_ack:
        name: message_ack
        title: 多轮消息回执
        payload:
          type: object
          required: [type, taskId, messageId, delivery, at]
          properties:
            type: { type: string, const: message_ack }
            taskId: { type: string }
            messageId: { type: string }
            turnId: { type: string }
            eventSeq: { type: integer, minimum: 1 }
            delivery: { type: string, enum: [queued, duplicate, rejected] }
            errorCode: { type: string }
            at: { type: string, format: date-time }
      session_ack:
        name: session_ack
        title: 会话控制回执
        description: close_session / cancel_turn 的幂等回执；终态后仍会返回。
        payload:
          type: object
          required: [type, taskId, operationId, action, ok, at]
          properties:
            type: { type: string, const: session_ack }
            taskId: { type: string }
            operationId: { type: string }
            action: { type: string, enum: [close_session, cancel_turn] }
            ok: { type: boolean }
            status: { type: string }
            errorCode: { type: string }
            at: { type: string, format: date-time }
      pong:
        name: pong
        title: 应用层心跳响应
        payload:
          type: object
          required: [type, at]
          properties:
            type: { type: string, const: pong }
            at: { type: integer, format: int64 }
  downstream:
    title: platform → bridge
    description: 平台下发的指令。bridge 对每条指令都做形状校验，非法即忽略并记日志
    messages:
      run_task:
        name: run_task
        title: 下发任务
        payload:
          type: object
          required: [type, taskId, agentType, cwd, args]
          properties:
            type: { type: string, const: run_task }
            taskId: { type: string }
            agentType: { type: string, description: 必须是白名单内的 kind，否则本地拒绝 }
            cwd: { type: string, description: 设备上的绝对路径，须落在 allowed_cwd（若配置）内 }
            args:
              type: array
              items: { type: string }
              description: 参数数组（不经 shell）。传空数组表示用适配器的默认模板
            prompt: { type: string }
            timeoutMs:
              type: integer
              description: 从**入队**开始计时，缺省 10 分钟
            allowInteractive: { type: boolean }
            captureDiff: { type: boolean, description: 终态回传 unified diff（P0-6） }
            sessionMode: { type: string, enum: [task, conversation], description: '缺省 task；conversation 回合间保持 waiting_user' }
            permissionMode:
              type: string
              enum: [default, full]
              description: |
                请求的权限模式（缺省 = 由本机 permission_policy 决定）。能否按 full 执行取决于
                本机策略与该工具的 full 映射：不满足时任务被拒绝（permission_policy_denied /
                permission_mode_unsupported），**不会**静默降级为 default。
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64, examples: [repair, test, free] }
            serviceToken:
              type: string
              maxLength: 256
              description: scoped 服务令牌 `abs_<kid>_<secret>`；一旦携带必须校验通过
      cancel_task:
        name: cancel_task
        title: 取消任务
        description: 若携带 serviceToken，需具备 `task:cancel` scope（持有 task:create 不足以取消）
        payload:
          type: object
          required: [type, taskId]
          properties:
            type: { type: string, const: cancel_task }
            taskId: { type: string }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      get_task:
        name: get_task
        title: 补取任务历史
        description: >-
          补取任务历史。不给游标回尾部窗口（最新 limit 条）；afterEventSeq 升序补洞；
          beforeEventSeq 回翻（严格小于游标的最新 limit 条，输出仍升序）；两者互斥。终态后仍可调用，需 session:read。
        payload:
          type: object
          required: [type, taskId]
          properties:
            type: { type: string, const: get_task }
            taskId: { type: string }
            requestId: { type: string, description: 会原样带回 task_snapshot }
            afterEventSeq: { type: integer, minimum: 0 }
            beforeEventSeq:
              type: integer
              minimum: 0
              description: 与 afterEventSeq 互斥；同时出现回 protocol_incompatible。
            limit: { type: integer, minimum: 1, maximum: 1000 }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      get_artifact:
        name: get_artifact
        title: 补取附件内容
        description: >-
          按 artifactId 取回已落盘内容，需 task:read scope，且 artifact 必须属于该 taskId。
          超过 1 MB 只回元数据（contentUnavailableReason=too_large），未知/已淘汰回 artifact_not_found。
        payload:
          type: object
          required: [type, taskId, artifactId]
          properties:
            type: { type: string, const: get_artifact }
            taskId: { type: string }
            artifactId: { type: string }
            requestId: { type: string, description: 会原样带回 artifact_content }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      artifact_upload_start:
        name: artifact_upload_start
        title: 启动附件上传
        payload:
          type: object
          required: [type, taskId, operationId, name, mimeType, size, sha256]
          properties:
            type: { type: string, const: artifact_upload_start }
            taskId: { type: string }
            operationId: { type: string }
            name: { type: string }
            mimeType: { type: string }
            size: { type: integer, minimum: 0 }
            sha256: { type: string }
            chunkSize: { type: integer, minimum: 1, maximum: 1048576 }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      artifact_upload_chunk:
        name: artifact_upload_chunk
        title: 上传附件 chunk
        payload:
          type: object
          required: [type, transferId, offset, data, chunkSha256]
          properties:
            type: { type: string, const: artifact_upload_chunk }
            transferId: { type: string }
            offset: { type: integer, minimum: 0 }
            data: { type: string, description: base64 }
            chunkSha256: { type: string }
      artifact_download_start:
        name: artifact_download_start
        title: 启动附件下载
        payload:
          type: object
          required: [type, taskId, artifactId, operationId]
          properties:
            type: { type: string, const: artifact_download_start }
            taskId: { type: string }
            artifactId: { type: string }
            operationId: { type: string }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      artifact_download_chunk_ack:
        name: artifact_download_chunk_ack
        title: 下载 chunk 确认
        payload:
          type: object
          required: [type, transferId, nextOffset]
          properties:
            type: { type: string, const: artifact_download_chunk_ack }
            transferId: { type: string }
            nextOffset: { type: integer, minimum: 0 }
      artifact_upload_complete:
        name: artifact_upload_complete
        title: 完成附件上传
        payload:
          type: object
          required: [type, transferId, size, sha256]
          properties:
            type: { type: string, const: artifact_upload_complete }
            transferId: { type: string }
            size: { type: integer, minimum: 0 }
            sha256: { type: string }
      get_interaction_url:
        name: get_interaction_url
        title: 获取交互短期 URL
        description: 需要 task:respond scope；只返回进程内 Vault 中未过期的 URL。
        payload:
          type: object
          required: [type, taskId, requestId]
          properties:
            type: { type: string, const: get_interaction_url }
            taskId: { type: string }
            requestId: { type: string }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      task_interaction_response:
        name: task_interaction_response
        title: 回复交互
        description: permission 需要 task:approve，form/auth-url 需要 task:respond；responseId 幂等。
        payload:
          type: object
          required: [type, taskId, requestId, responseId, state]
          properties:
            type: { type: string, const: task_interaction_response }
            taskId: { type: string }
            requestId: { type: string }
            responseId: { type: string }
            state: { type: string, enum: [accepted, declined, cancelled] }
            payload: { type: object, additionalProperties: true }
            respondedBy: { type: string, maxLength: 128 }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      send_message:
        name: send_message
        title: 发送多轮消息
        description: conversation 且 waiting_user 时创建新 Turn；messageId 为幂等键。
        payload:
          type: object
          required: [type, taskId, messageId, parts]
          properties:
            type: { type: string, const: send_message }
            taskId: { type: string }
            messageId: { type: string }
            mode: { type: string, enum: [queue, steer], default: queue }
            parts:
              type: array
              minItems: 1
              items:
                type: object
                required: [kind, text]
                properties:
                  kind: { type: string, const: text }
                  text: { type: string }
            respondedBy: { type: string, maxLength: 128 }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      close_session:
        name: close_session
        title: 关闭会话
        description: operationId 为幂等键；终态会话重复关闭返回原状态。
        payload:
          type: object
          required: [type, taskId, operationId]
          properties:
            type: { type: string, const: close_session }
            taskId: { type: string }
            operationId: { type: string }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      cancel_turn:
        name: cancel_turn
        title: 取消指定 Turn
        payload:
          type: object
          required: [type, taskId, turnId, operationId]
          properties:
            type: { type: string, const: cancel_turn }
            taskId: { type: string }
            turnId: { type: string }
            operationId: { type: string }
            requestedBy: { type: string, maxLength: 128 }
            purpose: { type: string, maxLength: 64 }
            serviceToken: { type: string, maxLength: 256 }
      scan:
        name: scan
        title: 重新探测本机工具
        payload:
          type: object
          required: [type]
          properties:
            type: { type: string, const: scan }
            requestId: { type: string, description: 会原样带回 scan_progress / scan_result }
      ping:
        name: ping
        title: 应用层心跳
        payload:
          type: object
          required: [type]
          properties:
            type: { type: string, const: ping }
            at: { type: integer, format: int64 }
