components:
  schemas:
    AgentListItem:
      type: object
      required: [kind, display, status, capability]
      properties:
        kind: { type: string, examples: [claude-code, codex] }
        display: { type: string }
        version: { type: string }
        status: { type: string, enum: [not_installed, installed_no_cred, ready] }
        path: { type: string, description: 命中的可执行文件路径，便于排查 }
        credentialSource: { type: string, examples: ['env:OPENAI_API_KEY', 'file:~/.codex/auth.json'] }
        capability: { type: string, enum: [non_interactive, interactive_only] }
        installedButBroken: { type: boolean }
        steps:
          type: boolean
          description: 是否支持 task_step 步骤流；false 的工具平台应隐藏步骤面板而不是空转
        logo: { type: string, description: 'data:image/svg+xml;base64,… 24×24 单色；按 kind 缓存' }
        executionModes:
          type: array
          description: |
            按执行模式列出的能力（缺省 = 只有 headless 且等于 legacy capability）。
            新平台以它为准：某模式的 permissionModes 不含 full，就别请求 full（bridge 会在 spawn 前拒绝）；
            interactionKinds 为空表示该模式不能回问；continuation 说明后续回合怎么接回本会话，
            single-turn 的工具开 conversation 会在创建时回 session_not_continuable。
          items:
            type: object
            required: [mode, permissionModes, interactionKinds, feedKinds, continuation]
            properties:
              mode: { type: string, enum: [headless, acp-stdio] }
              permissionModes:
                type: array
                items: { type: string, enum: [default, full] }
              interactionKinds:
                type: array
                items: { type: string, enum: [permission, form, auth-url] }
              feedKinds:
                type: array
                items: { type: string, enum: [messages, steps, artifacts] }
              continuation:
                type: string
                enum: [native-session, resume-session, replay-session, single-turn]
                description: |
                  native-session = 会话由 agent 持有，bridge 只回传 ID（ACP session/load|resume、app-server thread/resume）；
                  resume-session = 靠 CLI 续接参数接上同一个原生会话；
                  replay-session = 新进程 + 完整持久 transcript 当 prompt（12/12 的底线）；
                  single-turn = CLI 不接受后续 prompt，不能开 conversation。
    ErrorCode:
      type: string
      description: 受控错误码（与 src/core/errors.ts 的 BRIDGE_ERROR_CODES 同源）
      enum:
        - protocol_incompatible
        - tool_not_installed
        - tool_no_credentials
        - tool_broken
        - cwd_missing
        - cwd_not_allowed
        - device_busy
        - timeout
        - cancelled
        - agent_error
        - internal
        - unauthorized
        - invalid_token
        - token_expired
        - insufficient_scope
        - tenant_not_supported
        - permission_mode_unsupported
        - permission_policy_denied
        - session_deleted
        - session_history_pruned
        - task_not_found
        - artifact_not_found
