openapi: 3.1.0
info:
  title: agent-bridge local control plane
  version: '1.0.0'
  summary: Loopback-only HTTP surface for other programs on the same machine.
  description: |
    `agent-bridge connect` starts it on `127.0.0.1:8787` by default and falls forward when the port
    is occupied; `agent-bridge serve <platformUrl> --port=8787` can still set it explicitly.

    It binds loopback only, so it is not an inbound network surface. Its audience is **other
    programs on this machine** (IDE extensions, scripts, MCP servers, CI runners) — remote platforms
    keep using the outbound WebSocket described by `asyncapi-3.0.yaml`; this is a separate channel.

    Rules enforced by the harness (`npm run arch:check`): loopback bind only and no CORS headers ever.
    Every route except `/v1/health` requires a scoped Bearer token (`abs_<kid>_<secret>`) issued by
    `agent-bridge services issue`.

    Errors are RFC 9457 `application/problem+json` and carry the same controlled `code` enum as the
    wire protocol (`src/core/errors.ts`), so clients branch on `code`, never on prose.
servers:
  - url: 'http://127.0.0.1:8787'
    description: Loopback only (never 0.0.0.0)
security:
  - bearerAuth: []
tags:
  - name: device
  - name: tasks
  - name: a2a-gateway
paths:
  /.well-known/agent-card.json:
    get:
      tags: [a2a-gateway]
      summary: A2A agent card（add-a2a-acp-gateway 提案；默认关闭）
      description: |
        静态描述（name/version/skills/capabilities），不含任务数据——与面板页壳同口径免令牌。
        `capabilities` 只声明真实已实现的能力（streaming/pushNotifications 当前为 false，
        订阅实现后才会翻 true）。skills 来自静态适配器表（12 个 CLI），不触发扫描。
        需 `[gateway] enabled = true`（或 `AGENT_BRIDGE_GATEWAY=1`）才会挂此路由，否则 404。
      security: []
      responses:
        '200':
          description: Agent Card（A2A v1.0 字段 + 0.3 兼容字段）
          content:
            application/json:
              schema: { type: object }
        '404': { description: 网关未启用（默认关闭） }
  /a2a:
    post:
      tags: [a2a-gateway]
      summary: A2A JSON-RPC 2.0 入口（GetTask / SendMessage / CancelTask / SubscribeToTask）
      description: |
        JSON-RPC 2.0 单对象（不支持 batch）。方法名 v1.0 PascalCase 与 0.3 小写都接受。
        版本协商走 `A2A-Version` 请求头（空/缺省按 0.3，`1.0` 用 TASK_STATE_* 拼写，其余 `-32009`）。
        逐方法鉴权；跨租户/不存在统一 `-32001`；`task_log` 只在 `Task.metadata.bridge.taskLogEndpoint`
        给指引，不冒充 A2A Message/Artifact。

        - **GetTask**（`tasks/get`，scope `session:read`/`task:read`）：SQLite 快照 → A2A Task。
        - **SendMessage**（`message/send`，scope `task:create`）：`message.parts`（仅 text）拼接为
          prompt；**bridge 扩展字段在 `message.metadata`**——`agentType`（受管白名单内）与 `cwd`
          必填，`timeoutMs` 可选。`messageId` 即幂等键：重发同 messageId 返回同一 taskId
          （`Task.metadata.idempotentReplay: true`），同 messageId 异参回 `-32000` + `data.code:
          idempotency_conflict`。**立即返回**（等价 returnImmediately）：长任务后续状态走 GetTask
          轮询或 SubscribeToTask 订阅。
        - **CancelTask**（`tasks/cancel`，scope `task:cancel`）：与 `POST /v1/tasks/{id}:cancel`
          同一条编排（SIGTERM → 2s → SIGKILL）；终态任务回 `-32002`（规范语义）；
          非网关通道创建的任务同样 `-32002`。
        - **SubscribeToTask**（`tasks/resubscribe`，scope `session:read`/`task:read`）：SSE 流，
          `eventSeq` 补洞（起点 `params.metadata.afterEventSeq`，缺省 0）。帧格式为 bridge 网关
          自定义：`task`（完整快照，首帧与终帧）/ `message` / `status` / `artifact`（各带
          eventSeq）/ `log|step`（调试扩展）/ `done`。终态任务按规范回 `-32004`。
      security:
        - bearerAuth: []
      parameters:
        - name: A2A-Version
          in: header
          required: false
          schema: { type: string, examples: ['1.0', '0.3'] }
          description: 空/缺省按 0.3 语义；patch 号不参与协商。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc, method]
              properties:
                jsonrpc: { type: string, const: '2.0' }
                id: { description: string 或 number；通知（无 id）按 null 回 }
                method: { type: string, enum: [GetTask, tasks/get, SendMessage, message/send, CancelTask, tasks/cancel, SubscribeToTask, tasks/resubscribe] }
                params:
                  type: object
                  properties:
                    id: { type: string, description: 任务 id（GetTask/CancelTask/SubscribeToTask） }
                    message:
                      type: object
                      description: SendMessage 的消息体（parts 仅 text；metadata 带 bridge 扩展字段）
                    metadata:
                      type: object
                      description: SubscribeToTask 的补洞游标（afterEventSeq）
      responses:
        '200':
          description: JSON-RPC 2.0（成功 result=Task；错误 error.code 如 -32001/-32002/-32004/-32005/-32009/-32601；SendMessage 成功亦 200）
          content:
            application/json:
              schema: { type: object }
        '401': { description: 缺令牌（problem+json，与 /v1/* 同一套） }
        '403': { description: scope 不足 / 非回环来源 }
        '404': { description: 网关未启用（默认关闭） }
  /acp:
    post:
      tags: [a2a-gateway]
      summary: ACP v1 over HTTP（vendor-specific：请求 POST + prompt 下行 SSE）
      description: |
        JSON-RPC 2.0 单对象。ACP v1 稳定方法集 + 本网关的 HTTP 承载约定
        （ACP Transports RFD 未定稿期间的 vendor 选择）：

        - **initialize**：只声明真实能力（loadSession=false —— 会话不持久续接；
          prompt 只收 text block；fs/terminal 客户端能力不开放）。
        - **session/new**（scope `device:read`）：固化 `params.cwd` 与
          `params._meta.agentType`（12 个受管 CLI 必须显式选择，网关不猜）→ `{sessionId}`。
        - **session/prompt**（scope `task:create`，conversation 多轮）：首轮创建 bridge conversation
          会话（`run_task` 语义）；后续轮 `send_message` 续接同一会话（CLI 原生续接，上下文由
          CLI 持有、token 只传增量）。响应是 SSE 流：`event: prompt`（taskId + first/continue）→
          `event: update`（`session/update` 通知，agent_message_chunk）→ 交互时
          `event: request`（agent→client 请求，见下）→ `event: result`（本轮 turn 结束：
          `{stopReason, content}`，`waiting_user → end_turn`；turn 失败/超时走 JSON-RPC error，
          会话随之关闭）。会话空闲回收复用 conversation 的 `idleTimeoutMs`；bridge 重启后
          ACP 绑定丢失（内存态）。
        - **session/cancel**（scope `task:cancel`）：取消当前轮次（`cancel_turn` 编排，
          operationId 幂等）；无活动轮次静默成功（v1 notification 语义）。
        - **交互应答（响应报文）**：无 `method`、带 `id` + `result` 的 body。`id` 必须是
          网关在 `event: request` 帧里下发的出站请求 id。permission 的 result 是
          `{outcome: {outcome: 'selected'|'cancelled', optionId}}`；elicitation 的 result 是
          `{action: 'accept'|'decline'|'cancel', content?}`。网关转成
          `task_interaction_response` 走与 `POST /v1/interactions/{id}:respond` **同一条**
          dispatch 路径（permission 要 `task:approve`，form/auth-url 要 `task:respond`）。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jsonrpc]
              properties:
                jsonrpc: { type: string, const: '2.0' }
                id: { description: string 或 number；交互应答时必须是网关下发的字符串 }
                method: { type: string, enum: [initialize, session/new, session/prompt, session/cancel] }
                params:
                  type: object
                  properties:
                    cwd: { type: string, description: session/new 的会话根目录 }
                    sessionId: { type: string, description: ACP 会话 id（acp_ 前缀） }
                    prompt: { description: ContentBlock 数组（仅 type=text）；session/prompt }
                    _meta: { type: object, description: 扩展字段（session/new 带 agentType） }
                result: { description: 交互应答结果（permission outcome / elicitation action） }
      responses:
        '200':
          description: JSON-RPC 2.0 响应；session/prompt 是 text/event-stream（SSE 帧：prompt/update/request/result/heartbeat）
          content:
            application/json:
              schema: { type: object }
            text/event-stream:
              schema: { type: string, description: 'event: prompt|update|request|result|heartbeat' }
        '400': { description: 非法信封 / 畸形应答（json body） }
        '401': { description: 缺令牌 }
        '403': { description: scope 不足 / 非回环来源 }
        '404': { description: 网关未启用或未找到出站请求 }
        '409': { description: 交互应答被 dispatch 拒绝（json body，含 errorCode） }
  /:
    get:
      tags: [device]
      summary: 内嵌 Web 任务面板（页面壳免令牌，数据仍走带鉴权的 /v1/* 端点）
      description: |
        终端面板（TTY 状态表）之外的交互表面：四态任务表 + 每行日志按钮
        （执行中走 SSE 实时流，排队中置灰，终态看环形缓冲回放）。
        EventSource 无法自定义请求头，故所有端点额外接受 `?token=` query 兜底
        （与 Bearer 同口径校验；仅本机回环，令牌勿外发）。
      security: []
      responses:
        '200': { description: text/html 页面壳 }
  /v1/health:
    get:
      tags: [device]
      summary: Liveness / readiness / version
      description: |
        The only route that needs no token — safe for container and CI probes.
        The state DB runs `PRAGMA quick_check` on open and refuses to start when it fails
        (a corrupt file that still opens would otherwise fail mid-task). Pass
        `?integrity=quick` to re-run that check now; it reads the whole DB, so it stays off
        the default probe path.
      security: []
      parameters:
        - name: integrity
          in: query
          required: false
          schema: { type: string, enum: [quick] }
          description: Re-run the state-DB integrity check and include `db` in the response.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  ready: { type: boolean }
                  db:
                    type: object
                    description: Present only when `?integrity=quick` was requested.
                    properties:
                      ok: { type: boolean }
                      detail: { type: string, description: First few problems reported by quick_check }
                    required: [ok]
                  controlPlane:
                    type: object
                    properties:
                      host: { type: string }
                      port: { type: integer }
                      requireToken: { type: boolean }
                  tasks:
                    type: object
                    properties:
                      tracked: { type: integer }
                      running: { type: integer }
                      queued: { type: integer }
                  capacity:
                    type: object
                    properties:
                      maxTasks: { type: integer }
                      maxQueued: { type: integer }
                required: [status, version, ready]
  /v1/metrics:
    get:
      tags: [device]
      summary: Minimal Prometheus metrics
      description: Process uptime, registry task counts, sessions and memory; requires device:read.
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/whoami:
    get:
      tags: [device]
      summary: Current principal (JWT or service token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  principal:
                    type: object
                    properties:
                      subject: { type: string }
                      tenantId: { type: string }
                      scopes:
                        type: array
                        items: { type: string }
  /v1/capabilities:
    get:
      tags: [device]
      summary: Capabilities and endpoint index (same source as hello.capabilities)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items: { type: string }
                  protocolVersion: { type: integer }
                  scopes:
                    type: array
                    items: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents:
    get:
      tags: [device]
      summary: Installed agents and their credential state (`?fresh=true` to re-probe)
      parameters:
        - name: fresh
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentListItem' }
                  scannedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents:scan:
    post:
      tags: [device]
      summary: Trigger a fresh scan (same as GET /v1/agents?fresh=true)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/board:
    get:
      tags: [tasks]
      summary: 面板聚合视图：任务注册表 + 计数 + 容量（与终端面板同源）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      running: { type: integer }
                      queued: { type: integer }
                      success: { type: integer }
                      failed: { type: integer }
                  capacity:
                    type: object
                    properties:
                      running: { type: integer }
                      queued: { type: integer }
                      maxTasks: { type: integer }
                      maxQueued: { type: integer }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/BoardTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/artifacts:gc:
    post:
      tags: [artifacts]
      summary: 显式 TTL 清理 artifact（按 CAS 引用计数，不自动执行）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlDays: { type: integer, minimum: 1, default: 30 }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttlDays: { type: integer }
                  dryRun: { type: boolean }
                  scanned: { type: integer }
                  deleted: { type: integer }
                  filesRemoved: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions:
    get:
      tags: [sessions]
      summary: 持久会话列表（按 created_at 升序，返回末尾 limit 条）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions/{id}:
    get:
      tags: [sessions]
      summary: 会话快照（Session + Turns + Events + Artifacts）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: afterEventSeq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: 下载会话附件（流式，Content-Disposition attachment）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 附件字节流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/events:
    get:
      tags: [sessions]
      summary: 会话 SSE：先回放历史，再接实时事件
      description: |
        event 类型：snapshot / event / wire / heartbeat / done。
        afterEventSeq 之后的持久事件先回放；终态会话回放后立即 done。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: afterEventSeq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/interactions:
    get:
      tags: [interactions]
      summary: 交互列表（有界，按 created_at 倒序；`state=pending` 最常用）
      description: |
        只读。需要 `session:read`，1.0 之前签发的 `task:read` 仍被接受（窄 scope 优先）。
        Form 的答案从不在此返回（只存字段名），auth-url 的完整 URL 只在进程内 vault 里。
      parameters:
        - name: taskId
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema:
            type: string
            enum: [pending, accepted, declined, cancelled, expired, failed]
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [interactions]
                properties:
                  interactions:
                    type: array
                    items: { $ref: '#/components/schemas/InteractionSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/interactions/{requestId}:
    get:
      tags: [interactions]
      summary: 单条交互快照（pending 请求 + 已结算结果）
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [interaction]
                properties:
                  interaction: { $ref: '#/components/schemas/InteractionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/interactions/{requestId}:respond:
    post:
      tags: [interactions]
      summary: 响应一条交互（HTTP 通道，与 WS 共用同一套判定）
      description: |
        permission 交互需要 `task:approve`；form / auth-url 需要 `task:respond`。
        同 `responseId` 重放是幂等的（回既有终态）；换 `responseId` 再答已结算的请求回 409。
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                  enum: [accepted, declined, cancelled]
                responseId:
                  type: string
                  description: 幂等键；缺省由服务端生成
                payload:
                  type: object
                  description: permission 传 optionId；form 传 content（按 requestedSchema 校验）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [taskId, requestId, state]
                properties:
                  taskId: { type: string }
                  requestId: { type: string }
                  state: { type: string, enum: [accepted, declined, cancelled] }
                  responseId: { type: string }
                  resultSeq: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 已结算（responseId 与既有不同）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '410':
          description: 交互已过期
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501':
          description: 该进程未启用交互响应通道（只读模式）
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /v1/tasks:
    get:
      tags: [tasks]
      summary: Task ledger, cursor-paginated (cursor, not offset — the list keeps moving)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TaskRecord' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tasks]
      summary: Create a task
      description: |
        `Idempotency-Key` makes a retried submission return the same `taskId` instead of running twice.
        The task goes through the same `TaskSupervisor` as platform tasks, so `max_tasks` covers both
        channels, and it reports upstream through the same `Emitter`.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      events: { type: string }
        '200':
          description: Idempotent replay (same Idempotency-Key)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      idempotentReplay: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: Task state plus terminal artifacts (diff / changedFiles)
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskRecord' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tasks/{id}/events:
    get:
      tags: [tasks]
      summary: 'SSE stream: log + status events for one task'
      description: |
        Late subscribers are backfilled from a bounded ring buffer before live events start.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}/steps:
    get:
      tags: [tasks]
      summary: 步骤时间线（完整步骤序列 + 最终回答文本）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  status: { type: string }
                  phase: { type: string }
                  stepCount: { type: integer }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        action: { type: string }
                        label: { type: string }
                        state: { type: string, enum: [started, finished] }
                        ok: { type: boolean }
                        at: { type: integer, format: int64 }
                        finishedAt: { type: integer, format: int64 }
                  plan:
                    type: array
                    description: 待办计划快照（TodoWrite 类工具；全部 12 个工具的 7 族解析器均支持）
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        state: { type: string, enum: [pending, in_progress, completed] }
                  finalText: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tasks/{id}/file:
    get:
      tags: [tasks]
      summary: 任务产物文件预览（锁任务 cwd + allowed_cwd 白名单，≤512KB）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string }, description: 相对任务 cwd 的路径 }
      responses:
        '200': { description: 文件内容（content-type 按扩展名：md/html/图片/文本） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 路径越出任务工作目录或不在 allowed_cwd }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 超过预览上限 }
  /v1/tasks/{id}/diff:
    get:
      tags: [tasks]
      summary: Terminal diff only — the task is never re-run to produce it
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  diff: { type: string }
                  changedFiles:
                    type: array
                    items: { type: string }
                  diffTruncated: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}:cancel:
    post:
      tags: [tasks]
      summary: Cancel a task (idempotent; already-settled tasks return 200 with alreadySettled)
      description: |
        Only tasks created through this channel can be cancelled here — tasks dispatched by the remote
        platform are owned by that session (409). Cancellation is SIGTERM, then SIGKILL after 2 s.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      alreadySettled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Scoped service token: abs_<kid>_<secret> (agent-bridge services issue)'
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request body or parameters
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing / invalid / expired token
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Token valid but the required scope is missing
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Session does not exist
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Problem:
      description: RFC 9457 problem details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Same controlled enum as the wire protocol (src/core/errors.ts)
      required: [type, title, status, code]
    InteractionSummary:
      type: object
      properties:
        taskId: { type: string }
        requestId: { type: string }
        kind: { type: string, enum: [permission, form, auth-url] }
        state: { type: string, enum: [pending, accepted, declined, cancelled, expired, failed] }
        payload:
          type: object
          description: permission 为 toolCall/options；form 为 message/requestedSchema（永不含答案）
        turnId: { type: string }
        expiresAt: { type: string, format: date-time }
        responseId: { type: string }
        resultSeq: { type: integer }
        resultPayload:
          type: object
          description: 已结算结果；Form 只保留 action 与字段名
        createdAt: { type: string, format: date-time }
      required: [taskId, requestId, kind, state, createdAt]
    SessionSummary:
      type: object
      properties:
        sessionId: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        mode: { type: string, enum: [task, conversation] }
        status: { type: string, enum: [running, success, failed, cancelled, timeout] }
        phase: { type: string, enum: [queued, running, waiting_interaction, waiting_user, settled] }
        agentType: { type: string }
        cwd: { type: string }
        nativeSessionId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        oldestEventSeq: { type: integer }
        latestEventSeq: { type: integer }
      required: [sessionId, tenantId, mode, status, phase, createdAt, updatedAt]
    SessionSnapshot:
      type: object
      properties:
        session: { $ref: '#/components/schemas/SessionSummary' }
        turns:
          type: array
          items: { type: object, additionalProperties: true }
        events:
          type: array
          items:
            type: object
            properties:
              eventSeq: { type: integer }
              type: { type: string }
              payload: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
            required: [eventSeq, type, payload, createdAt]
        interactions:
          type: array
          items: { type: object, additionalProperties: true }
        artifacts:
          type: array
          items: { type: object, additionalProperties: true }
        oldestEventSeq: { type: integer }
        latestEventSeq: { type: integer }
        hasMoreBefore:
          type: boolean
          description: 窗口起点之前还有内容（与 WS 的 task_snapshot 同义）
        prunedThrough:
          type: integer
          description: 历史裁剪水位；未裁剪的会话不带该字段
        partialMessages:
          type: array
          description: >-
            本回合已吐出但未定稿的助手文本（内存态，不落库）；终态后为空或缺失。
            仅当控制面注入了半截消息读取时出现，与 WS 的 task_snapshot.partialMessages 同源。
          items: { $ref: '#/components/schemas/PartialMessage' }
      required: [session, turns, events, interactions, artifacts]
    PartialMessage:
      type: object
      properties:
        messageId: { type: string, description: '形如 pm_<taskId>，不是 msg_* 幂等键' }
        role: { type: string, enum: [user, agent, system] }
        text: { type: string }
        updatedAt: { type: string, format: date-time }
        truncated: { type: boolean, description: 已达 32 KiB 上限，后续增量不再累积 }
      required: [messageId, role, text, updatedAt]
    AgentListItem:
      type: object
      description: |
        与 WS `agent_list` 的 AgentListItem 同一份对象（控制面不自造精简视图，否则字段一多就会漂移）。
      required: [kind, display, status, capability]
      properties:
        kind: { type: string }
        display: { type: string }
        status: { type: string, enum: [ready, installed_no_cred, not_installed] }
        version: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        credentialSource:
          type: string
          description: 凭据来源（`env:NAME` / `file:~/.codex/auth.json` / `platform`），不含密钥
        capability:
          type: string
          enum: [non_interactive, interactive_only]
          description: 0.x 展示标签，仅为旧平台保留；能力以 `executionModes` 为准
        installedButBroken: { type: boolean }
        logo: { type: string, description: 品牌图标 data URI（24×24 单色），按 kind 缓存 }
        steps: { type: boolean, description: 是否支持 task_step 步骤流 }
        executionModes:
          type: array
          description: |
            按执行模式列出的能力。每项含 `continuation`（native-session / resume-session /
            replay-session / single-turn），说明后续回合怎么接回本会话；
            `single-turn` 的工具无法创建 conversation（创建时回 session_not_continuable）。
          items:
            type: object
            required: [mode, permissionModes, interactionKinds, feedKinds, continuation]
            properties:
              mode: { type: string, enum: [headless, acp-stdio] }
              permissionModes:
                type: array
                items: { type: string, enum: [default, full] }
              interactionKinds:
                type: array
                items: { type: string, enum: [permission, form, auth-url] }
              feedKinds:
                type: array
                items: { type: string, enum: [messages, steps, artifacts] }
              continuation:
                type: string
                enum: [native-session, resume-session, replay-session, single-turn]
    CreateTask:
      type: object
      properties:
        agentType: { type: string }
        cwd: { type: string }
        prompt: { type: string }
        args:
          type: array
          items: { type: string }
        timeoutMs: { type: integer }
        captureDiff: { type: boolean }
        permissionMode:
          type: string
          enum: [default, full]
          description: |
            请求的权限模式。本机 `permission_policy` 同样适用（受管参数模式不会被本地通道绕过）：
            不满足时返回 `permission_policy_denied` / `permission_mode_unsupported`，不会降级执行。
        requestedBy: { type: string }
        purpose: { type: string }
        allowInteractive:
          type: boolean
          description: |
            本任务是否申请交互（权限/表单），等价 WS `run_task.allowInteractive`。
            只接受布尔（字符串/数字 400）。生效还须本机以 `--interaction-enabled` 启动；
            不满足时按非交互执行，CLI 的权限申请会被本机直接拒绝（不伪造选项、不阻塞等待）。
            交互请求可经 `GET /v1/interactions` 查看、`POST /v1/interactions/{id}:respond` 应答。
      required: [agentType, cwd]
    BoardTask:
      type: object
      description: 面板任务行（task-registry 的视图；与 TaskRecord 台账不同源——这是实时聚合）
      properties:
        taskId: { type: string }
        agentType: { type: string }
        cwdShort: { type: string, description: 目录 basename（面板不暴露全路径） }
        source: { type: string, enum: [platform, control-plane] }
        status: { type: string, enum: [running, success, failed, cancelled, timeout] }
        phase: { type: string, enum: [queued, running] }
        queuePosition: { type: integer }
        error: { type: string }
        currentStep:
          type: object
          properties:
            seq: { type: integer }
            action: { type: string }
            label: { type: string }
        stepCount: { type: integer }
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        settledAt: { type: integer, format: int64 }
      required: [taskId, agentType, cwdShort, source, status, stepCount, createdAt]
    TaskRecord:
      type: object
      properties:
        taskId: { type: string }
        agentType: { type: string }
        cwd: { type: string }
        state:
          type: string
          enum: [running, success, failed, cancelled, timeout]
        phase: { type: string, enum: [queued, running] }
        queuePosition: { type: integer }
        exitCode: { type: integer }
        error: { type: string }
        errorCode: { type: string }
        diff: { type: string }
        changedFiles:
          type: array
          items: { type: string }
        diffTruncated: { type: boolean }
        requestedBy: { type: string }
        purpose: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [taskId, agentType, cwd, state]
