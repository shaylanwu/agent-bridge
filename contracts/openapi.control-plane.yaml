openapi: 3.1.0
info:
  title: agent-bridge local control plane
  version: '1.0.0'
  summary: Loopback-only HTTP surface for other programs on the same machine.
  description: |
    `agent-bridge connect` starts it on `127.0.0.1:8787` by default and falls forward when the port
    is occupied; `agent-bridge serve <platformUrl> --port=8787` can still set it explicitly.

    It binds loopback only, so it is not an inbound network surface. Its audience is **other
    programs on this machine** (IDE extensions, scripts, MCP servers, CI runners) — remote platforms
    keep using the outbound WebSocket described by `asyncapi-3.0.yaml`; this is a separate channel.

    Rules enforced by the harness (`npm run arch:check`): loopback bind only and no CORS headers ever.
    Every route except `/v1/health` requires a scoped Bearer token (`abs_<kid>_<secret>`) issued by
    `agent-bridge services issue`.

    Errors are RFC 9457 `application/problem+json` and carry the same controlled `code` enum as the
    wire protocol (`src/core/errors.ts`), so clients branch on `code`, never on prose.
servers:
  - url: 'http://127.0.0.1:8787'
    description: Loopback only (never 0.0.0.0)
security:
  - bearerAuth: []
tags:
  - name: device
  - name: tasks
paths:
  /:
    get:
      tags: [device]
      summary: 内嵌 Web 任务面板（页面壳免令牌，数据仍走带鉴权的 /v1/* 端点）
      description: |
        终端面板（TTY 状态表）之外的交互表面：四态任务表 + 每行日志按钮
        （执行中走 SSE 实时流，排队中置灰，终态看环形缓冲回放）。
        EventSource 无法自定义请求头，故所有端点额外接受 `?token=` query 兜底
        （与 Bearer 同口径校验；仅本机回环，令牌勿外发）。
      security: []
      responses:
        '200': { description: text/html 页面壳 }
  /v1/health:
    get:
      tags: [device]
      summary: Liveness / readiness / version
      description: The only route that needs no token — safe for container and CI probes.
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  ready: { type: boolean }
                  controlPlane:
                    type: object
                    properties:
                      host: { type: string }
                      port: { type: integer }
                      requireToken: { type: boolean }
                  tasks:
                    type: object
                    properties:
                      tracked: { type: integer }
                      running: { type: integer }
                      queued: { type: integer }
                  capacity:
                    type: object
                    properties:
                      maxTasks: { type: integer }
                      maxQueued: { type: integer }
                required: [status, version, ready]
  /v1/metrics:
    get:
      tags: [device]
      summary: Minimal Prometheus metrics
      description: Process uptime, registry task counts, sessions and memory; requires device:read.
      responses:
        '200':
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }
  /v1/whoami:
    get:
      tags: [device]
      summary: Current principal (JWT or service token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated: { type: boolean }
                  principal:
                    type: object
                    properties:
                      subject: { type: string }
                      tenantId: { type: string }
                      scopes:
                        type: array
                        items: { type: string }
  /v1/capabilities:
    get:
      tags: [device]
      summary: Capabilities and endpoint index (same source as hello.capabilities)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  capabilities:
                    type: array
                    items: { type: string }
                  protocolVersion: { type: integer }
                  scopes:
                    type: array
                    items: { type: string }
                  endpoints:
                    type: array
                    items: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents:
    get:
      tags: [device]
      summary: Installed agents and their credential state (`?fresh=true` to re-probe)
      parameters:
        - name: fresh
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  agents:
                    type: array
                    items: { $ref: '#/components/schemas/AgentListItem' }
                  scannedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/agents:scan:
    post:
      tags: [device]
      summary: Trigger a fresh scan (same as GET /v1/agents?fresh=true)
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/board:
    get:
      tags: [tasks]
      summary: 面板聚合视图：任务注册表 + 计数 + 容量（与终端面板同源）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  counts:
                    type: object
                    properties:
                      running: { type: integer }
                      queued: { type: integer }
                      success: { type: integer }
                      failed: { type: integer }
                  capacity:
                    type: object
                    properties:
                      running: { type: integer }
                      queued: { type: integer }
                      maxTasks: { type: integer }
                      maxQueued: { type: integer }
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/BoardTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/artifacts:gc:
    post:
      tags: [artifacts]
      summary: 显式 TTL 清理 artifact（按 CAS 引用计数，不自动执行）
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ttlDays: { type: integer, minimum: 1, default: 30 }
                dryRun: { type: boolean, default: false }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ttlDays: { type: integer }
                  dryRun: { type: boolean }
                  scanned: { type: integer }
                  deleted: { type: integer }
                  filesRemoved: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions:
    get:
      tags: [sessions]
      summary: 持久会话列表（按 created_at 升序，返回末尾 limit 条）
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items: { $ref: '#/components/schemas/SessionSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/sessions/{id}:
    get:
      tags: [sessions]
      summary: 会话快照（Session + Turns + Events + Artifacts）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: afterEventSeq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionSnapshot' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/artifacts/{artifactId}:
    get:
      tags: [artifacts]
      summary: 下载会话附件（流式，Content-Disposition attachment）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: artifactId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 附件字节流
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/sessions/{id}/events:
    get:
      tags: [sessions]
      summary: 会话 SSE：先回放历史，再接实时事件
      description: |
        event 类型：snapshot / event / wire / heartbeat / done。
        afterEventSeq 之后的持久事件先回放；终态会话回放后立即 done。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: afterEventSeq
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: text/event-stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tasks:
    get:
      tags: [tasks]
      summary: Task ledger, cursor-paginated (cursor, not offset — the list keeps moving)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items: { $ref: '#/components/schemas/TaskRecord' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [tasks]
      summary: Create a task
      description: |
        `Idempotency-Key` makes a retried submission return the same `taskId` instead of running twice.
        The task goes through the same `TaskSupervisor` as platform tasks, so `max_tasks` covers both
        channels, and it reports upstream through the same `Emitter`.
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTask' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      events: { type: string }
        '200':
          description: Idempotent replay (same Idempotency-Key)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      idempotentReplay: { type: boolean, const: true }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tasks/{id}:
    get:
      tags: [tasks]
      summary: Task state plus terminal artifacts (diff / changedFiles)
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/TaskRecord' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Problem' }
  /v1/tasks/{id}/events:
    get:
      tags: [tasks]
      summary: 'SSE stream: log + status events for one task'
      description: |
        Late subscribers are backfilled from a bounded ring buffer before live events start.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: Event stream
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}/steps:
    get:
      tags: [tasks]
      summary: 步骤时间线（完整步骤序列 + 最终回答文本）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  status: { type: string }
                  phase: { type: string }
                  stepCount: { type: integer }
                  steps:
                    type: array
                    items:
                      type: object
                      properties:
                        seq: { type: integer }
                        action: { type: string }
                        label: { type: string }
                        state: { type: string, enum: [started, finished] }
                        ok: { type: boolean }
                        at: { type: integer, format: int64 }
                        finishedAt: { type: integer, format: int64 }
                  plan:
                    type: array
                    description: 待办计划快照（TodoWrite 类工具；全部 12 个工具的 7 族解析器均支持）
                    items:
                      type: object
                      properties:
                        text: { type: string }
                        state: { type: string, enum: [pending, in_progress, completed] }
                  finalText: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tasks/{id}/file:
    get:
      tags: [tasks]
      summary: 任务产物文件预览（锁任务 cwd + allowed_cwd 白名单，≤512KB）
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string }, description: 相对任务 cwd 的路径 }
      responses:
        '200': { description: 文件内容（content-type 按扩展名：md/html/图片/文本） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: 路径越出任务工作目录或不在 allowed_cwd }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: 超过预览上限 }
  /v1/tasks/{id}/diff:
    get:
      tags: [tasks]
      summary: Terminal diff only — the task is never re-run to produce it
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  taskId: { type: string }
                  diff: { type: string }
                  changedFiles:
                    type: array
                    items: { type: string }
                  diffTruncated: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /v1/tasks/{id}:cancel:
    post:
      tags: [tasks]
      summary: Cancel a task (idempotent; already-settled tasks return 200 with alreadySettled)
      description: |
        Only tasks created through this channel can be cancelled here — tasks dispatched by the remote
        platform are owned by that session (409). Cancellation is SIGTERM, then SIGKILL after 2 s.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TaskRecord'
                  - type: object
                    properties:
                      alreadySettled: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Scoped service token: abs_<kid>_<secret> (agent-bridge services issue)'
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
  responses:
    BadRequest:
      description: Invalid request body or parameters
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unauthorized:
      description: Missing / invalid / expired token
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: Token valid but the required scope is missing
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: Session does not exist
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Problem:
      description: RFC 9457 problem details
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Same controlled enum as the wire protocol (src/core/errors.ts)
      required: [type, title, status, code]
    SessionSummary:
      type: object
      properties:
        sessionId: { type: string }
        tenantId: { type: string }
        contextId: { type: string }
        mode: { type: string, enum: [task, conversation] }
        status: { type: string, enum: [running, success, failed, cancelled, timeout] }
        phase: { type: string, enum: [queued, running, waiting_interaction, waiting_user, settled] }
        agentType: { type: string }
        cwd: { type: string }
        nativeSessionId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        oldestEventSeq: { type: integer }
        latestEventSeq: { type: integer }
      required: [sessionId, tenantId, mode, status, phase, createdAt, updatedAt]
    SessionSnapshot:
      type: object
      properties:
        session: { $ref: '#/components/schemas/SessionSummary' }
        turns:
          type: array
          items: { type: object, additionalProperties: true }
        events:
          type: array
          items:
            type: object
            properties:
              eventSeq: { type: integer }
              type: { type: string }
              payload: { type: object, additionalProperties: true }
              createdAt: { type: string, format: date-time }
            required: [eventSeq, type, payload, createdAt]
        interactions:
          type: array
          items: { type: object, additionalProperties: true }
        artifacts:
          type: array
          items: { type: object, additionalProperties: true }
        oldestEventSeq: { type: integer }
        latestEventSeq: { type: integer }
      required: [session, turns, events, interactions, artifacts]
    AgentListItem:
      type: object
      properties:
        kind: { type: string }
        display: { type: string }
        status: { type: string, enum: [ready, installed_no_cred, not_installed] }
        version: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        installedButBroken: { type: boolean }
        steps: { type: boolean, description: 是否支持 task_step 步骤流 }
    CreateTask:
      type: object
      properties:
        agentType: { type: string }
        cwd: { type: string }
        prompt: { type: string }
        args:
          type: array
          items: { type: string }
        timeoutMs: { type: integer }
        captureDiff: { type: boolean }
        permissionMode:
          type: string
          enum: [default, full]
          description: |
            请求的权限模式。本机 `permission_policy` 同样适用（受管参数模式不会被本地通道绕过）：
            不满足时返回 `permission_policy_denied` / `permission_mode_unsupported`，不会降级执行。
        requestedBy: { type: string }
        purpose: { type: string }
      required: [agentType, cwd]
    BoardTask:
      type: object
      description: 面板任务行（task-registry 的视图；与 TaskRecord 台账不同源——这是实时聚合）
      properties:
        taskId: { type: string }
        agentType: { type: string }
        cwdShort: { type: string, description: 目录 basename（面板不暴露全路径） }
        source: { type: string, enum: [platform, control-plane] }
        status: { type: string, enum: [running, success, failed, cancelled, timeout] }
        phase: { type: string, enum: [queued, running] }
        queuePosition: { type: integer }
        error: { type: string }
        currentStep:
          type: object
          properties:
            seq: { type: integer }
            action: { type: string }
            label: { type: string }
        stepCount: { type: integer }
        createdAt: { type: integer, format: int64 }
        startedAt: { type: integer, format: int64 }
        settledAt: { type: integer, format: int64 }
      required: [taskId, agentType, cwdShort, source, status, stepCount, createdAt]
    TaskRecord:
      type: object
      properties:
        taskId: { type: string }
        agentType: { type: string }
        cwd: { type: string }
        state:
          type: string
          enum: [running, success, failed, cancelled, timeout]
        phase: { type: string, enum: [queued, running] }
        queuePosition: { type: integer }
        exitCode: { type: integer }
        error: { type: string }
        errorCode: { type: string }
        diff: { type: string }
        changedFiles:
          type: array
          items: { type: string }
        diffTruncated: { type: boolean }
        requestedBy: { type: string }
        purpose: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [taskId, agentType, cwd, state]
